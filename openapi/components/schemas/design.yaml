    Design:
      properties:
        id:
          description: 'The design hashed id'
          type: string
          example: AS3df3A
        name:
          description: 'The design name'
          type: string
          example: Beauty
        design:
          description: 'The design HTML template sections'
          type: object
          properties:
            includes:
              type: string
              description: 'CSS and style includes'
            header:
              type: string
              description: 'Header HTML template'
            body:
              type: string
              description: 'Body HTML template'
            footer:
              type: string
              description: 'Footer HTML template'
            product:
              type: string
              description: 'Product table row template'
            task:
              type: string
              description: 'Task table row template'
        is_custom:
          description: 'Flag to determine if the design is a custom user design'
          type: boolean
          example: true
        is_active:
          description: 'Flag to determine if the design is available for use'
          type: boolean
          example: true
        is_deleted:
          description: 'Flag to determine if the design is deleted'
          type: boolean
          example: true
        created_at:
          description: Timestamp
          type: number
          format: integer
          example: '134341234234'
        updated_at:
          description: Timestamp
          type: number
          format: integer
          example: '134341234234'
        deleted_at:
          description: Timestamp
          type: number
          format: integer
          example: '134341234234'
      type: object